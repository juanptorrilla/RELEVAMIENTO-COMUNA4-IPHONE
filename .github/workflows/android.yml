name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, version-4, autoria-v7 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar archivos web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Instalar funciones nativas de Descargas y selección de fotos
        run: python scripts/install-native-plugin.py

      - name: Generar icono de Comuna 4
        run: npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: relevamiento-arbolado-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
